# Local full stack: PostgreSQL 16 + the API. `docker compose up --build`, then http://localhost:4000/api/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    # Host port 5434, so it doesn't clash with a locally installed PostgreSQL on 5432.
    # Only needed to inspect the DB from the host (psql -h localhost -p 5434 -U quiz quiz);
    # the API reaches it over the compose network as db:5432.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://quiz:quiz@db:5432/quiz
      # Local-only value; production secrets come from the host's secret store.
      JWT_ACCESS_SECRET: efe17f45dfb71bbacf6eec4c6a572e5ca0167f76285e7743b78f5ce79b063be9
      CORS_ORIGIN: http://localhost:5173
      # Plain HTTP locally, so cookies cannot be Secure; same-site in dev, so Strict works.
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: strict
      SEED_ON_START: "true"

volumes:
  pgdata:
