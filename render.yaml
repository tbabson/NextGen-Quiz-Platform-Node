# Render Blueprint: the API only, as one Docker web service. The database is hosted on Neon.
# New > Blueprint > pick this repo. Render then asks for the two `sync: false` values:
#   DATABASE_URL  Neon's *direct* (non-pooled) connection string, e.g.
#                 postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
#                 (Neon dashboard > Connect > untick "Connection pooling").
#   CORS_ORIGIN   the deployed client URL.
services:
  - type: web
    name: punch-nextgen-quiz-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Neon only accepts TLS connections; the certificate is verified.
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # e.g. https://punch-nextgen-quiz.onrender.com
      # onrender.com is a public suffix, so client and API on two *.onrender.com hosts are cross-site:
      # the refresh cookie must be SameSite=None (+ Secure, the production default).
      - key: COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_ON_START
        value: "true"
