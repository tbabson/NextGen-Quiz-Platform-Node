# Render Blueprint: one Docker web service + one managed PostgreSQL 16 database.
# New > Blueprint > pick this repo. Then set CORS_ORIGIN to the deployed client URL.
services:
  - type: web
    name: punch-nextgen-quiz-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: punch-nextgen-quiz-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # e.g. https://punch-nextgen-quiz.onrender.com
      # onrender.com is a public suffix, so client and API on two *.onrender.com hosts are cross-site:
      # the refresh cookie must be SameSite=None (+ Secure, the production default).
      - key: COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_ON_START
        value: "true"

databases:
  - name: punch-nextgen-quiz-db
    plan: free
    postgresMajorVersion: "16"
