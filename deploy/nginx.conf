# Self-hosting behind Nginx (Ubuntu/Debian: /etc/nginx/sites-available/quiz.conf).
#
# Serves the built React client and the API from ONE origin, so the refresh cookie is first-party:
# run the API with COOKIE_SAMESITE=strict, TRUST_PROXY=1, CORS_ORIGIN=https://quiz.example.com,
# bound to 127.0.0.1:4000 (e.g. under systemd or `docker run -p 127.0.0.1:4000:4000`).
# TLS certificates: `sudo certbot --nginx -d quiz.example.com`.

# Coarse per-IP limit in front of the app's own fine-grained limits.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream quiz_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name quiz.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quiz.example.com;

    ssl_certificate     /etc/letsencrypt/live/quiz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Matches the API's 100 KB JSON body cap, so oversized bodies are rejected before reaching Node.
    client_max_body_size 100k;

    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://quiz_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so clients cannot spoof their IP for the rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlates Nginx access logs with the API's pino logs.
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # React build output (vite build → dist/). Unknown paths fall back to index.html for client routing.
    root /var/www/quiz/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
